<crucible-dialog
  [dialogTitle]="'An application named ' + file.name + ' has been created.'"
  [form]="form"
  submitLabel="Add to Selected"
  cancelLabel="Do Not Add to any Teams"
  (submit)="submit()"
>
  <div crucibleDialogContent [formGroup]="form">
    <h3>Would you like to add this application to any of the teams?</h3>
    <div class="d-flex justify-content-center">
      <mat-form-field class="team-select">
        <mat-label>Teams</mat-label>
        <mat-select
          multiple
         [ngModel]="file.teamIds"
         formControlName="teams"
         class="team-select"
        >
          @for (team of currentTeams; track team) {
            <mat-option [value]="team.team.id">{{ team.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</crucible-dialog>
