<mat-list class="list-container">
  @let list = applications$ | async;
  @for (app of list?.background; track app.id) {
    <iframe
      aria-hidden="true"
      class="hidden-app-iframe"
      [src]="app.safeUrl"
    ></iframe>
  }
  @for (app of list?.apps; track app.id) {
    @if (mini()) {
      <mat-list-item class="app-item app-item-mini">
        <a
          [title]="app.name"
          [href]="app.themedUrl"
          (click)="openApplication(app, $event)"
          class="app-link-mini"
        >
          <img class="app-icon" src="{{ app.icon }}" alt="{{ app.name }}" />
        </a>
      </mat-list-item>
    } @else {
      <mat-list-item class="app-item">
        <div class="app-button-container">
          <a
            matButton
            [title]="app.name"
            class="px-0 w-100 normal-text justify-content-start"
            [href]="app.themedUrl"
            (click)="openApplication(app, $event)"
          >
            <div class="d-flex align-items-center">
              <img class="lefticon" src="{{ app.icon }}" alt="{{ app.name }}" />
              <div class="app-name px-2">
                {{ app.name }}
              </div>
            </div>
          </a>
        </div>
      </mat-list-item>
    }
  }
</mat-list>
