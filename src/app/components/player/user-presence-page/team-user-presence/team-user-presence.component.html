<cdk-virtual-scroll-viewport
  tvsItemSize="itemSize"
  headerHeight="headerSize"
  [style.height]="tableHeight"
>
  <mat-table [dataSource]="userDatasource">
    <!-- Name Column -->
    <ng-container matColumnDef="user-name">
      <mat-header-cell *matHeaderCellDef>Name</mat-header-cell>
      <mat-cell *matCellDef="let element">
        {{ element.userName }}
      </mat-cell>
    </ng-container>

    <!-- Online Column -->
    <ng-container matColumnDef="online">
      <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
      <mat-cell *matCellDef="let element">
        <mat-chip-set>
          @if (element.online) {
            <mat-chip
              class="status online player-status-chip player-status-chip-online"
              disableRipple
              ><span class="dot"></span>Online</mat-chip
            >
          } @else {
            <mat-chip class="status player-status-chip" disableRipple
              ><span class="dot"></span>Offline</mat-chip
            >
          }
        </mat-chip-set>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns" />
    <mat-row *matRowDef="let row; columns: displayedColumns" />
  </mat-table>
</cdk-virtual-scroll-viewport>
