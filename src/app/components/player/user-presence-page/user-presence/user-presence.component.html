<div>
  <div class="d-flex align-items-center w-100 my-1 player-dense-buttons">
    <span class="d-flex align-items-center flex-grow-1 gap-2">
      <mat-form-field
        class="search-field player-dense-field"
        subscriptSizing="dynamic"
      >
        <input
          matInput
          aria-label="Search"
          placeholder="Search"
          [(ngModel)]="searchTerm"
          (keyup)="applyFilter($event.target.value)"
        />
        @if (searchTerm !== '') {
          <button
            type="button"
            matIconButton
            matSuffix
            aria-label="Clear Search"
            matTooltip="Clear Search"
            (click)="clearFilter()"
          >
            <mat-icon aria-hidden="true" fontIcon="mdi-close" />
          </button>
        }
      </mat-form-field>
      <button
        type="button"
        matButton="outlined"
        (click)="accordion().openAll()"
      >
        Expand All
      </button>
      <button
        type="button"
        matButton="outlined"
        (click)="accordion().closeAll()"
      >
        Collapse All
      </button>
      <mat-checkbox
        class="search-checkbox text"
        color="primary"
        (change)="setHideInactive($event.checked)"
        >Hide Offline</mat-checkbox
      >
    </span>
    @if (showCloseButton()) {
      <span class="me-1">
        <button
          mat-icon-button
          aria-label="Close"
          mat-dialog-close
          (click)="closeMe.emit()"
          title="Close"
          tabindex="-1"
        >
          <mat-icon class="mdi-24px self-center" fontIcon="mdi-close" />
        </button>
      </span>
    }
  </div>

  <mat-accordion class="presence-accordion player-flat-panels" multi>
    @for (team of _teams | async; track trackByTeamId(team)) {
      @let users = getPresenceByTeamId(team.id) | async;
      @let currentSearchTerm = searchTerm$ | async;
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            {{ team.name }}
          </mat-panel-title>
          <mat-panel-description>
            Count: {{ getPresenceCount(users, currentSearchTerm) }}
          </mat-panel-description>
        </mat-expansion-panel-header>

        <app-team-user-presence
          [team]="team"
          [users]="users"
          [searchTerm]="currentSearchTerm"
          [hideInactive]="hideInactive"
        />
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
