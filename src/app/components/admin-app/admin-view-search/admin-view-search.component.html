<app-admin-view-edit
  [class.hidden]="!showEditScreen"
  (editComplete)="onEditComplete($event)"
/>

<div [class.hidden]="showEditScreen" class="view-list-container player-list">
  <div class="player-head">
    <h1 class="header-text">Views</h1>
  </div>
  <div class="player-tools player-dense-buttons">
    <mat-form-field
      class="search-field player-dense-field"
      subscriptSizing="dynamic"
    >
      <input
        matInput
        aria-label="Search"
        placeholder="Search"
        [(ngModel)]="filterString"
        (keyup)="applyFilter($event.target.value)"
      />
      @if (filterString !== '') {
        <button
          type="button"
          matIconButton
          matSuffix
          aria-label="Clear Search"
          title="Clear Search"
          (click)="clearFilter()"
        >
          <mat-icon aria-hidden="true" fontIcon="mdi-close" />
        </button>
      }
    </mat-form-field>
    <span class="end">
      <button
        type="button"
        matButton="outlined"
        aria-label="Import Views"
        matTooltip="Import Views"
        (click)="openDialog(importDialog)"
      >
        <mat-icon aria-hidden="true" fontIcon="mdi-tray-arrow-down" />Import
      </button>
      <button
        type="button"
        matButton="outlined"
        aria-label="Export Views"
        matTooltip="Export Views"
        [matBadge]="
          selection.selected.length > 0 ? selection.selected.length : ''
        "
        (click)="openDialog(exportDialog)"
      >
        <mat-icon aria-hidden="true" fontIcon="mdi-tray-arrow-up" />Export
      </button>
      <button
        type="button"
        matButton="filled"
        aria-label="Add a new View"
        matTooltip="Add a new View"
        (click)="addNewView()"
      >
        <mat-icon aria-hidden="true" fontIcon="mdi-plus" />New View
      </button>
    </span>
  </div>

  <mat-table #table [dataSource]="viewDataSource" matSort>
    <ng-container matColumnDef="select">
      <mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="$event ? toggleAllRows() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
        />
      </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row.id) : null"
          [checked]="selection.isSelected(row.id)"
        />
      </mat-cell>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Name
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          [attr.aria-label]="'Copy ID of ' + element.name"
          ngxClipboard
          [cbContent]="element.id"
          title="Copy:  {{ element.id }}"
        >
          <mat-icon
            style="transform: scale(0.85)"
            fontIcon="mdi-content-copy"
          />
        </button>
        <button
          mat-button
          class="px-0 normal-text"
          (click)="executeViewAction('edit', element.id)"
        >
          {{ element.name }}
        </button>
        @if (element.isTemplate) {
          <span class="player-template-badge">TEMPLATE</span>
        }
      </mat-cell>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Description
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <div class="description-text" style="margin: 5px">
          {{ element.description }}
        </div>
      </mat-cell>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Status
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <div class="team-text">{{ element.status }}</div>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" />
    <mat-row *matRowDef="let row; columns: displayedColumns" />
  </mat-table>
  @if (viewDataSource.filteredData.length === 0) {
    <div class="player-empty">No results found</div>
  }
  <mat-paginator
    #paginator
    [pageSize]="defaultPageSize"
    [pageSizeOptions]="[10, 20, 30]"
    [showFirstLastButtons]="true"
  />

  @if (isLoading) {
    <mat-card class="d-flex justify-content-center align-items-center">
      <mat-progress-spinner mode="indeterminate" />
    </mat-card>
  }
</div>

<ng-template #exportDialog>
  <app-admin-app-view-export
    [ids]="selection.selected"
    (complete)="closeDialog()"
  />
</ng-template>

<ng-template #importDialog>
  <app-admin-app-view-import (complete)="importComplete()" />
</ng-template>
