<div class="player-head">
  <h1 class="header-text">Users</h1>
</div>
<div class="player-tools player-dense-buttons">
  <mat-form-field
    class="search-field player-dense-field"
    subscriptSizing="dynamic"
  >
    <input
      matInput
      aria-label="Search"
      placeholder="Search"
      [(ngModel)]="filterString"
      (keyup)="applyFilter($event.target.value)"
    />
    @if (filterString) {
      <button
        type="button"
        matIconButton
        matSuffix
        aria-label="Clear Search"
        title="Clear Search"
        (click)="applyFilter('')"
      >
        <mat-icon aria-hidden="true" fontIcon="mdi-close" />
      </button>
    }
  </mat-form-field>
  <div class="end">
    <mat-paginator
      #paginator
      [pageIndex]="0"
      [pageSize]="20"
      [pageSizeOptions]="[5, 10, 15, 20, 25, 50, 100, 200]"
    />
  </div>
</div>

<div class="table-container">
  <table mat-table [dataSource]="userDataSource" matSort>
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          [attr.aria-label]="'Copy ID of ' + element.name"
          ngxClipboard
          [cbContent]="element.id"
          (click)="$event.stopPropagation()"
          title="Copy:  {{ element.id }}"
        >
          <mat-icon class="mdi-24px" fontIcon="mdi-content-copy" />
        </button>
        {{ element.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    @for (column of attributeColumns; track column.columnId) {
      <ng-container [matColumnDef]="column.columnId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ column.name }}
        </th>
        <td mat-cell *matCellDef="let element">
          {{ getAttributeValue(element, column.key) }}
        </td>
      </ng-container>
    }

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let element">
        <app-roles-permissions-select
          [user]="element"
          [canEdit]="canEdit$ | async"
        />
        @if (canEdit$ | async) {
          <button
            mat-icon-button
            [attr.aria-label]="'Delete user ' + element.name"
            (click)="deleteUser(element); $event.stopPropagation()"
            title="Delete User"
          >
            <mat-icon class="mdi-24px" fontIcon="mdi-trash-can-outline" />
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (isLoading) {
    <mat-card
      appearance="outlined"
      style="display: flex; justify-content: center; align-items: center"
    >
      <mat-progress-spinner color="primary" mode="indeterminate" />
    </mat-card>
  }
</div>
