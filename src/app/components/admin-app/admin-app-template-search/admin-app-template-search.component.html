<div class="list-container player-list">
  <div class="player-head">
    <h1 class="header-text">Application Templates</h1>
  </div>
  <div class="player-tools player-dense-buttons">
    <mat-form-field
      class="search-field player-dense-field"
      subscriptSizing="dynamic"
    >
      <input
        matInput
        aria-label="Search"
        placeholder="Search"
        [(ngModel)]="filterString"
        (keyup)="applyFilter($event.target.value)"
      />
      @if (filterString !== '') {
        <button
          type="button"
          matIconButton
          matSuffix
          aria-label="Clear Search"
          title="Clear Search"
          (click)="clearFilter()"
        >
          <mat-icon aria-hidden="true" fontIcon="mdi-close" />
        </button>
      }
    </mat-form-field>
    <span class="end">
      @if (canManage$ | async) {
        <button
          type="button"
          matButton="outlined"
          aria-label="Import Application Templates"
          matTooltip="Import Application Templates"
          (click)="openDialog(importDialog)"
        >
          <mat-icon aria-hidden="true" fontIcon="mdi-tray-arrow-down" />Import
        </button>
      }
      <button
        type="button"
        matButton="outlined"
        aria-label="Export Application Templates"
        matTooltip="Export Application Templates"
        [matBadge]="
          selection.selected.length > 0 ? selection.selected.length : ''
        "
        (click)="openDialog(exportDialog)"
      >
        <mat-icon aria-hidden="true" fontIcon="mdi-tray-arrow-up" />Export
      </button>
      @if (canManage$ | async) {
        <button
          type="button"
          matButton="filled"
          aria-label="Add a new Application Template"
          matTooltip="Add a new Application Template"
          (click)="addAppTemplate()"
        >
          <mat-icon aria-hidden="true" fontIcon="mdi-plus" />New Template
        </button>
      }
    </span>
  </div>

  <mat-table #table [dataSource]="appTemplateDataSource" matSort>
    <ng-container matColumnDef="select">
      <mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="$event ? toggleAllRows() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
        />
      </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row.id) : null"
          [checked]="selection.isSelected(row.id)"
        />
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Name
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <img
          class="app-icon"
          src="{{ element.icon }}"
          alt="{{ element.name }} Icon"
        />&nbsp;&nbsp;{{ element.name }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="url">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Url </mat-header-cell>
      <mat-cell *matCellDef="let element; let i = index">
        <div class="w-100">
          <mat-expansion-panel
            class="my-1"
            [expanded]="
              currentAppTemplate !== undefined &&
              element.id === currentAppTemplate.id
            "
            (opened)="currentAppTemplate = element"
          >
            <mat-expansion-panel-header>
              <mat-panel-title style="font-size: small">
                {{ element.url }}
              </mat-panel-title>
            </mat-expansion-panel-header>
            <app-admin-template-details
              (refresh)="refresh($event)"
              [appTemplate]="element"
              [templates]="appTemplateDataSource.data"
            />
          </mat-expansion-panel>
        </div>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="appTemplateColumns" />
    <mat-row *matRowDef="let row; columns: appTemplateColumns" />
  </mat-table>
  @if (appTemplateDataSource.filteredData.length === 0) {
    <div class="player-empty">No Application Templates found</div>
  }
  <mat-paginator
    #paginator
    [pageSize]="defaultPageSize"
    [pageSizeOptions]="[10, 20, 30]"
    [showFirstLastButtons]="true"
    (page)="pageEvent = $event"
  />
</div>

<ng-template #exportDialog>
  <app-admin-app-template-export
    [ids]="selection.selected"
    (complete)="closeDialog()"
  />
</ng-template>

<ng-template #importDialog>
  <app-admin-app-template-import (complete)="importComplete()" />
</ng-template>
