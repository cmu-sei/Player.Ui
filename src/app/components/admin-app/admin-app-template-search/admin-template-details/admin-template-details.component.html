@let canEdit = canEdit$ | async;
<div class="d-flex flex-column">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input
      matInput
      tabIndex="1"
      name="name"
      [disabled]="!canEdit"
      [(ngModel)]="appTemplate.name"
      (change)="editAppTemplate()"
    />
  </mat-form-field>
  <mat-form-field>
    <mat-label>URL</mat-label>
    <input
      matInput
      tabIndex="2"
      name="url"
      [disabled]="!canEdit"
      [(ngModel)]="appTemplate.url"
      (change)="editAppTemplate()"
    />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Icon Path</mat-label>
    <input
      matInput
      tabIndex="3"
      name="icon"
      [disabled]="!canEdit"
      [(ngModel)]="appTemplate.icon"
      (change)="editAppTemplate()"
    />
  </mat-form-field>
  <mat-form-field floatPlaceholder="always">
    <input matInput class="hide" />
    <mat-checkbox
      tabIndex="4"
      name="embeddable"
      [disabled]="!canEdit"
      [(ngModel)]="appTemplate.embeddable"
      (change)="editAppTemplate()"
      >Embeddable</mat-checkbox
    >
  </mat-form-field>
  <mat-form-field floatPlaceholder="always">
    <input matInput class="hide" />
    <mat-checkbox
      tabIndex="5"
      name="loadInBackground"
      [disabled]="!canEdit"
      [(ngModel)]="appTemplate.loadInBackground"
      (change)="editAppTemplate()"
      >Load in background</mat-checkbox
    >
  </mat-form-field>
  @if (canEdit) {
    <mat-form-field>
      <mat-label>Move its applications to</mat-label>
      <mat-select
        name="replacementTemplateId"
        [(ngModel)]="replacementTemplateId"
      >
        <mat-option [value]="null">None</mat-option>
        @for (other of otherTemplates; track other.id) {
          <mat-option [value]="other.id">
            {{ other.name }} &mdash; {{ other.url }}
          </mat-option>
        }
      </mat-select>
      <mat-hint>Needed only when views still use this template</mat-hint>
    </mat-form-field>
    <div class="bottom-button">
      <button mat-stroked-button (click)="deleteApplicationTemplate()">
        Delete Application Template
      </button>
    </div>
  }
</div>
