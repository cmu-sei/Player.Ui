<div class="container mat-elevation-z8 m-2">
  <table mat-table [dataSource]="dataSource$ | async" class="w-100">
    <ng-container matColumnDef="permissions">
      <th mat-header-cell *matHeaderCellDef>
        Permissions
        <button
          mat-icon-button
          [attr.aria-label]="adding ? 'Cancel' : 'Add'"
          (click)="addRole()"
          [disabled]="!(canEdit$ | async)"
          [matTooltip]="adding ? 'Cancel' : 'Add'"
        >
          <mat-icon [fontIcon]="adding ? 'mdi-cancel' : 'mdi-plus-circle'" />
        </button>
        @if (adding) {
          <span class="d-inline-flex gap-2">
            <button mat-raised-button (click)="addRole(); adding = false">
              Add Role
            </button>
            <button mat-raised-button (click)="addPermission(); adding = false">
              Add Permission
            </button>
          </span>
        }
        <button
          mat-icon-button
          aria-label="About roles"
          matTooltip="Roles can be set on Users or, if enabled in your environment, can be matched to Role Names from the token of the Identity Provider in use."
          matTooltipShowDelay="0"
        >
          <mat-icon fontIcon="mdi-information-outline" />
        </button>
      </th>
      <th mat-header-cell *matHeaderCellDef>All</th>
      <td mat-cell *matCellDef="let permission">
        <button
          mat-icon-button
          [attr.aria-label]="'About ' + permission?.name"
          [matTooltip]="permission.description"
          matTooltipShowDelay="0"
        >
          <mat-icon fontIcon="mdi-information-outline" />
        </button>
        {{ permission?.name }}
      </td>
    </ng-container>

    @for (role of roles$ | async; track trackById($index, role)) {
      <ng-container [matColumnDef]="role.name">
        <th mat-header-cell *matHeaderCellDef>
          <div class="d-flex">
            <p>{{ role.name }}</p>
            @if (canEdit$ | async) {
              @if (!role.immutable) {
                <button
                  mat-icon-button
                  [attr.aria-label]="'Rename role ' + role.name"
                  (click)="renameRole(role)"
                  title="Rename Role"
                >
                  <mat-icon fontIcon="mdi-pencil-outline" />
                </button>
              }
              @if (!role.immutable) {
                <button
                  mat-icon-button
                  [attr.aria-label]="'Delete role ' + role.name"
                  (click)="deleteRole(role)"
                  title="Delete Role"
                >
                  <mat-icon fontIcon="mdi-trash-can-outline" />
                </button>
              }
            }
          </div>
        </th>
        <td mat-cell *matCellDef="let permission">
          @if (permission.name == allPermission || !role.allPermissions) {
            <mat-checkbox
              [checked]="hasPermission(permission, role)"
              (change)="setPermission(permission, role, $event)"
              [disabled]="role.immutable || !(canEdit$ | async)"
            />
          }
        </td>
      </ng-container>
    }

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns$ | async; sticky: true"
    ></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns$ | async"></tr>
  </table>
</div>
