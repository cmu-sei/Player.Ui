@if (hasErrors$ | async) {
  <crucible-dialog dialogTitle="Export Application Templates" [hideDefaultActions]="true">
    <div crucibleDialogContent>
      <p class="text-danger">
        Some errors occurred during export. Check errors.txt in the archive for
        details.
      </p>
    </div>
    <ng-container crucibleDialogActions>
      <button matButton="filled" (click)="cancel()">OK</button>
    </ng-container>
  </crucible-dialog>
} @else {
  <crucible-dialog
    dialogTitle="Export Application Templates"
    [form]="form"
    submitLabel="Export"
    loadingLabel="Exporting..."
    [loading]="loading"
    [submitDisabled]="!form.valid"
    (cancel)="cancel()"
    (submit)="export()"
  >
    <div crucibleDialogContent [formGroup]="form" class="dialog-fields">
      @if (isArchiveable) {
        <mat-form-field>
          <mat-label>Archive Type</mat-label>
          <mat-select formControlName="archiveType">
            @for (archiveType of archiveTypes; track archiveType) {
              <mat-option [value]="archiveType">
                {{ archiveType }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      }
      <div class="toggle-row">
        <mat-slide-toggle
          formControlName="includeIcons"
          matTooltip="Include icon files in the exported archive"
        >Include Icons</mat-slide-toggle>
      </div>
      <div class="toggle-row">
        <mat-slide-toggle
          formControlName="embedIcons"
          matTooltip="Embed included Icons into exported JSON as data URIs"
        >Embed Icons</mat-slide-toggle>
      </div>
    </div>
  </crucible-dialog>
}
