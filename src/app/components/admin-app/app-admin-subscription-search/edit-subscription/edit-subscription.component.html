<crucible-dialog
  [dialogTitle]="currentSub == null ? 'Add Subscription' : 'Edit Subscription'"
  [form]="form"
  submitLabel="Save"
  (submit)="onSubmit()"
>
  <div crucibleDialogContent [formGroup]="form" class="d-flex flex-column">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input type="text" matNativeControl formControlName="name" cdkFocusInitial />
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Callback URL</mat-label>
      <input type="text" matNativeControl formControlName="callbackUri" />
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Client ID</mat-label>
      <input type="text" matNativeControl formControlName="clientId" />
    </mat-form-field>
    <div class="d-flex align-items-baseline">
      <mat-form-field matTooltip="Only viewable on creation" class="full-width">
        <mat-label>Client Secret</mat-label>
        <input type="text" matNativeControl formControlName="clientSecret" />
      </mat-form-field>
      <mat-checkbox
        class="ms-2"
        matTooltip="Client Secret is only updated if checked"
        [checked]="!currentSub?.clientSecretSet"
        (change)="editSecretChanged($event)"
        >Edit</mat-checkbox
      >
    </div>
    <mat-form-field class="full-width">
      <mat-label>Events</mat-label>
      <mat-select multiple formControlName="eventTypes">
        @for (e of eventTypes; track e) {
          <mat-option [value]="e">{{ e }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
</crucible-dialog>
