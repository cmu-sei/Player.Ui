<div class="subscriptions-container pl-list">
  <div class="pl-head">
    <h1 class="header-text">Subscriptions</h1>
  </div>
  <div class="pl-tools">
    <mat-form-field class="search-field" subscriptSizing="dynamic">
      <input
        matInput
        aria-label="Search"
        placeholder="Search"
        [(ngModel)]="filterStr"
        (keyup)="applyFilter($event.target.value)"
      />
      @if (filterStr !== '') {
        <button
          type="button"
          matIconButton
          matSuffix
          aria-label="Clear Search"
          title="Clear Search"
          (click)="clearFilter()"
        >
          <mat-icon aria-hidden="true" fontIcon="mdi-close" />
        </button>
      }
    </mat-form-field>
    <span class="end">
      <button
        type="button"
        matButton="filled"
        aria-label="Add a new Subscription"
        matTooltip="Add a new Subscription"
        (click)="addNewSubscription()"
      >
        <mat-icon aria-hidden="true" fontIcon="mdi-plus" />New Subscription
      </button>
    </span>
  </div>

  <mat-table #table [dataSource]="dataSource" matSort>
    <!-- Actions column -->
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef />
      <mat-cell *matCellDef="let element">
        <button
          mat-icon-button
          [attr.aria-label]="'Edit subscription ' + element.name"
          title="Edit Subscription"
          (click)="editSubscription(element)"
        >
          <mat-icon
            style="transform: scale(0.85)"
            fontIcon="mdi-pencil-outline"
          />
        </button>
        <button
          mat-icon-button
          [attr.aria-label]="'Delete subscription ' + element.name"
          title="Delete Subscription"
          (click)="deleteSubscription(element)"
        >
          <mat-icon
            style="transform: scale(0.85)"
            fontIcon="mdi-trash-can-outline"
          />
        </button>
      </mat-cell>
    </ng-container>

    <!-- Name column -->
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Name
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        {{ element.name }}
      </mat-cell>
    </ng-container>

    <!-- Error Column -->
    <ng-container matColumnDef="lastError">
      <mat-header-cell *matHeaderCellDef> Last Error </mat-header-cell>
      <mat-cell *matCellDef="let element">
        {{ element.lastError }}
      </mat-cell>
    </ng-container>

    <!-- EventTypes Column -->
    <ng-container matColumnDef="eventTypes">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Event Types
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        {{ element.eventTypes }}
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" />
    <mat-row *matRowDef="let row; columns: displayedColumns" />
  </mat-table>
</div>
